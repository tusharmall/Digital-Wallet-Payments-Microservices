server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: kyc-statement-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/kyc_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:kyc_app}
    password: ${SPRING_DATASOURCE_PASSWORD:kyc-local-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:kyc-statement-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
      missing-topics-fatal: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  kafka:
    transactions-topic: ${TRANSACTIONS_TOPIC:transactions.events}
  notifications:
    from-address: ${NOTIFICATION_FROM_ADDRESS:no-reply@wallet.local}
  wallet-service:
    base-url: ${WALLET_SERVICE_BASE_URL:http://localhost:8081}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token-change-me}
  statements:
    projection-wait-seconds: ${STATEMENT_PROJECTION_WAIT_SECONDS:60}
    projection-poll-millis: ${STATEMENT_PROJECTION_POLL_MILLIS:500}
  s3:
    region: ${AWS_REGION:ap-south-1}
    bucket: ${S3_BUCKET:digital-wallet-documents}
    endpoint: ${APP_S3_ENDPOINT:}
    presign-endpoint: ${APP_S3_PRESIGN_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:false}
    upload-url-minutes: ${S3_UPLOAD_URL_MINUTES:15}
    download-url-minutes: ${S3_DOWNLOAD_URL_MINUTES:10}
