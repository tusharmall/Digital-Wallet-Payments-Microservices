server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: wallet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wallet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:wallet_app}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet-local-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    admin:
      fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true

app:
  kafka:
    transactions-topic: ${TRANSACTIONS_TOPIC:transactions.events}
    dead-letter-topic: ${TRANSACTIONS_DLT_TOPIC:transactions.events.DLT}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token-change-me}

wallet:
  transfer:
    daily-limit: ${WALLET_DAILY_TRANSFER_LIMIT:100000.00}
    max-single-amount: ${WALLET_MAX_SINGLE_TRANSFER:50000.00}
  fraud:
    max-transfers-per-minute: ${WALLET_FRAUD_MAX_PER_MINUTE:10}
  rate-limit:
    transfers-per-minute: ${WALLET_RATE_LIMIT_PER_MINUTE:30}
