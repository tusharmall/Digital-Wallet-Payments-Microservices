services:
  mysql-wallet:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: wallet_db
      MYSQL_USER: ${MYSQL_WALLET_USER:-wallet_app}
      MYSQL_PASSWORD: ${MYSQL_WALLET_PASSWORD:-wallet-local-password}
      TZ: UTC
    ports:
      - "3308:3306"
    volumes:
      - wallet-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-kyc:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: kyc_db
      MYSQL_USER: ${MYSQL_KYC_USER:-kyc_app}
      MYSQL_PASSWORD: ${MYSQL_KYC_PASSWORD:-kyc-local-password}
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - kyc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server kafka:9092 > /dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      disable: true


  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-wallet:3306/wallet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_WALLET_USER:-wallet_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_WALLET_PASSWORD:-wallet-local-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me}
      OUTBOX_POLL_INTERVAL_MS: 1000
    ports:
      - "8081:8081"
    depends_on:
      mysql-wallet:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  kyc-statement-service:
    build:
      context: .
      dockerfile: kyc-statement-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-kyc:3306/kyc_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_KYC_USER:-kyc_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_KYC_PASSWORD:-kyc-local-password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WALLET_SERVICE_BASE_URL: http://wallet-service:8081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_S3_ENDPOINT: http://minio:9000
      APP_S3_PRESIGN_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-digital-wallet-documents}
      S3_AUTO_CREATE_BUCKET: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-local-password}
    ports:
      - "8082:8082"
    depends_on:
      mysql-kyc:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      wallet-service:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  wallet-mysql-data:
  kyc-mysql-data:
  redis-data:
  minio-data:
